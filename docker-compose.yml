services:
  fastapi-app:
    # 核心：直接指定本地已有的镜像（替换为你的镜像名:标签）
    image: fastapi-etl:v3.2  # 必须与本地已构建的镜像名一致
    container_name: my-fastapi-etl-pro  # 固定容器名，方便管理
#    restart: unless-stopped  # 容器退出后自动重启（除非手动停止）
    ports:
      - "8000:8001"  # 端口映射：宿主机8000 → 容器8001
    volumes:
      # 外部挂载模型目录（宿主机路径替换为你的实际路径）
      - ./models:/app/models
      # 外部挂载三方静态资源目录（宿主机路径替换为你的实际路径）ls
      - ./static:/app/static
      # 可选：挂载日志目录（方便查看容器日志）
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./files:/app/files
      - ./.env.production:/app/.env.production
      - ./.env.development:/app/.env.development
    environment:
      - ENVIRONMENT=development
    env_file:
      - .env
      - .env.development
    user: "fastapi"  # 与镜像中创建的非root用户一致（需提前在Dockerfile中配置）
    networks:
      - etl-network  # 与声明的外部网络名一致

networks:
  etl-network:
    external: true  # 表示使用已存在的网络（物理机创建的 etl-network）
    name: llm_project_etl-network